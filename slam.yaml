slam_toolbox:
  ros__parameters:
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: scan
    use_sim_time: false
    resolution: 0.05
    transform_timeout: 0.5
    scan_buffer_size: 10
    map_update_interval: 0.5
    minimum_travel_distance: 0.0
    minimum_travel_heading: 0.0
    max_laser_range: 5.0
    minimum_time_interval: 0.4
    loop_search_maximum_distance: 1.5
    transform_publish_period: 0.05
    throttle_scans: 1
    